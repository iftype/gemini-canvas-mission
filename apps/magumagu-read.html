<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마구마구읽기 - Liquid Fast Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;800&family=Pretendard:wght@400;600;900&display=swap');
        
        body {
            font-family: 'SF Pro Display', 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .liquid-card {
            border-radius: 2.5rem;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .reader-display {
            min-height: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem;
            overflow: hidden;
        }

        .pulse-animation {
            animation: textPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes textPop {
            0% { transform: scale(0.92); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .main-text {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: #1d1d1f;
            line-height: 1.2;
            word-break: keep-all;
            white-space: pre-wrap;
        }

        .translation-hint {
            font-size: 1.4rem;
            font-weight: 600;
            color: #4b5563;
            margin-top: 1.5rem;
            opacity: 0.7;
            height: 2.5rem;
            word-break: keep-all;
        }

        input[type="range"] {
            -webkit-appearance: none;
            background: rgba(0, 0, 0, 0.05);
            height: 6px;
            border-radius: 10px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #1d1d1f;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border: 2px solid white;
        }

        /* 투명한 배경에 검은 글자 버튼 스타일 */
        .btn-transparent-dark {
            background: rgba(255, 255, 255, 0.3);
            color: #1d1d1f;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-transparent-dark:hover {
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-transparent-dark:active {
            transform: translateY(0);
            background: rgba(255, 255, 255, 0.7);
        }

        /* 재생 버튼 특화 */
        .btn-play-glass {
            background: rgba(255, 255, 255, 0.5);
            color: #1d1d1f;
            border: 2px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .loading-dots div {
            width: 10px;
            height: 10px;
            background-color: #1d1d1f;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 0.6s infinite alternate;
        }
        .loading-dots div:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots div:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce { to { transform: translateY(-10px); } }
    </style>
</head>
<body class="p-6">
    <div class="max-w-4xl w-full mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">마구마구읽기</h1>
            <p class="text-gray-500 mt-2 font-medium">빠르게 정보를 습득하세요!</p>
        </header>

        <div id="input-container" class="glass liquid-card p-8 md:p-12 space-y-6">
            <textarea id="raw-text" class="w-full h-64 bg-white/40 border-none rounded-3xl p-6 text-lg focus:ring-4 focus:ring-black/5 focus:outline-none transition-all placeholder-gray-400" placeholder="여기에 텍스트를 붙여넣어주세요..."></textarea>
            
            <button id="process-btn" class="w-full btn-transparent-dark py-5 rounded-3xl text-xl font-bold flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
                핵심 본문만 추출하기
            </button>
        </div>

        <div id="reader-container" class="hidden space-y-8">
            <div id="display-container" class="glass liquid-card reader-display">
                <div id="main-text" class="main-text">Ready</div>
                <div id="translation-hint" class="translation-hint"></div>
            </div>
            
            <div class="glass liquid-card p-8 space-y-8">
                <div class="space-y-4">
                    <div class="flex justify-between items-end">
                        <span id="current-pos" class="text-3xl font-bold text-gray-800">0%</span>
                        <span id="word-count" class="text-sm font-semibold text-gray-400 uppercase tracking-widest">0 / 0</span>
                    </div>
                    <input type="range" id="progress-bar" class="w-full cursor-pointer" value="0" min="0" max="100">
                </div>

                <div class="flex flex-col md:flex-row items-center justify-between gap-8">
                    <div class="w-full md:w-1/3 space-y-3">
                        <div class="flex justify-between text-sm font-bold text-gray-500">
                            <span>단어당 속도</span>
                            <span id="speed-val" class="text-gray-800">220ms</span>
                        </div>
                        <input type="range" id="speed-slider" min="10" max="300" step="10" value="220" class="w-full">
                    </div>

                    <div class="flex items-center gap-6">
                        <button id="reset-btn" class="w-14 h-14 flex items-center justify-center rounded-full btn-transparent-dark">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        </button>
                        
                        <button id="play-btn" class="w-20 h-20 flex items-center justify-center rounded-full btn-transparent-dark btn-play-glass">
                            <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            <svg id="pause-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>

                        <button id="back-to-input" class="w-14 h-14 flex items-center justify-center rounded-full btn-transparent-dark">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                        </button>
                    </div>
                    <div class="hidden md:block w-1/3"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="loading-modal" class="fixed inset-0 bg-white/60 backdrop-blur-md hidden flex items-center justify-center z-50">
        <div class="text-center space-y-6">
            <div class="loading-dots"><div></div><div></div><div></div></div>
            <p class="text-xl font-bold text-gray-800">본문 내용을 정교하게 다듬는 중...</p>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        
        const rawTextArea = document.getElementById('raw-text');
        const processBtn = document.getElementById('process-btn');
        const readerContainer = document.getElementById('reader-container');
        const inputContainer = document.getElementById('input-container');
        const displayContainer = document.getElementById('display-container');
        const mainTextEl = document.getElementById('main-text');
        const hintEl = document.getElementById('translation-hint');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const speedSlider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        const progressBar = document.getElementById('progress-bar');
        const currentPosLabel = document.getElementById('current-pos');
        const wordCountLabel = document.getElementById('word-count');
        const loadingModal = document.getElementById('loading-modal');
        const resetBtn = document.getElementById('reset-btn');
        const backToInput = document.getElementById('back-to-input');

        let words = [];
        let currentIndex = 0;
        let isPlaying = false;
        let timer = null;
        let speedMs = 220; 

        async function fetchAISummary(text) {
            const systemPrompt = `너는 속독 가독성을 극대화하는 텍스트 가공 전문가야.
            1. 핵심 본문만 추출: 사람 이름(예: "홍길동"), 역할/직함, 콘티 정보(예: "콘티(조건형)"), 장면 번호, 대본 형식의 화자 등을 모두 제거해. 오직 글의 '내용'에만 집중해.
            2. 의미 단위 그룹화: "모바일 안드로이드"처럼 한 호흡에 읽어야 하는 단어들은 공백으로 묶어 한 화면에 표시되게 해.
            3. 부연 설명 처리: 괄호 안에 들어있던 내용 중 의미가 중요한 것만 "(설명)" 형식으로 단어 뒤에 붙여.
            4. 출력 형식: "의미단어그룹(부연설명)" 또는 "의미단어그룹" 형태들이 공백으로 구분된 텍스트만 출력해.`;
            
            const userQuery = `다음 텍스트에서 이름, 역할, 콘티 조건 등 불필요한 메타데이터를 제거하고 핵심 본문만 의미 단위로 묶어줘:\n\n${text}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                return result.candidates?.[0]?.content?.parts?.[0]?.text || "오류가 발생했습니다.";
            } catch (error) {
                return "네트워크 오류가 발생했습니다.";
            }
        }

        async function startProcessing() {
            const rawText = rawTextArea.value.trim();
            if (!rawText) return;

            loadingModal.classList.remove('hidden');

            try {
                const processedText = await fetchAISummary(rawText);
                words = processedText.split(/\s+/).filter(w => w.length > 0);
                
                if (words.length > 0) {
                    currentIndex = 0;
                    updateDisplay();
                    inputContainer.classList.add('hidden');
                    readerContainer.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
            } finally {
                loadingModal.classList.add('hidden');
            }
        }

        function updateDisplay() {
            if (words.length === 0) return;
            
            const currentWord = words[currentIndex];
            const match = currentWord.match(/^(.+?)\(([^)]+)\)$/);
            
            mainTextEl.classList.remove('pulse-animation');
            hintEl.classList.remove('pulse-animation');
            void mainTextEl.offsetWidth; 
            mainTextEl.classList.add('pulse-animation');
            hintEl.classList.add('pulse-animation');
            
            if (match) {
                mainTextEl.innerText = match[1];
                hintEl.innerText = `(${match[2]})`;
                if (match[1].length > 10) mainTextEl.style.fontSize = "2.8rem";
                else if (match[1].length > 6) mainTextEl.style.fontSize = "3.4rem";
                else mainTextEl.style.fontSize = "4rem";
            } else {
                mainTextEl.innerText = currentWord;
                hintEl.innerText = "";
                if (currentWord.length > 10) mainTextEl.style.fontSize = "2.8rem";
                else mainTextEl.style.fontSize = "4.5rem";
            }
            
            const progress = Math.round((currentIndex / (words.length - 1)) * 100) || 0;
            progressBar.value = progress;
            currentPosLabel.innerText = `${progress}%`;
            wordCountLabel.innerText = `${currentIndex + 1} / ${words.length}`;
        }

        function togglePlay() { if (isPlaying) pause(); else play(); }

        function play() {
            if (currentIndex >= words.length - 1) currentIndex = 0;
            isPlaying = true;
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
            runTimer();
        }

        function pause() {
            isPlaying = false;
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            clearTimeout(timer);
        }

        function runTimer() {
            if (!isPlaying) return;
            if (currentIndex < words.length - 1) {
                currentIndex++;
                updateDisplay();
                timer = setTimeout(runTimer, speedMs);
            } else {
                pause();
            }
        }

        processBtn.addEventListener('click', startProcessing);
        playBtn.addEventListener('click', togglePlay);
        resetBtn.addEventListener('click', () => { pause(); currentIndex = 0; updateDisplay(); });
        backToInput.addEventListener('click', () => { pause(); readerContainer.classList.add('hidden'); inputContainer.classList.remove('hidden'); });
        speedSlider.addEventListener('input', (e) => { speedMs = parseInt(e.target.value); speedVal.innerText = `${speedMs}ms`; });
        progressBar.addEventListener('input', (e) => {
            currentIndex = Math.floor((parseInt(e.target.value) / 100) * (words.length - 1));
            updateDisplay();
        });

        document.addEventListener('keydown', (e) => {
            if (readerContainer.classList.contains('hidden')) return;
            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        });
    </script>
</body>
</html>
